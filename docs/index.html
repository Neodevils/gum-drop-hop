<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gum Drop Hop</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e8e8ea;overscroll-behavior:none;
            font:13px/1.4 system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  ruffle-player,video{width:100%;height:100%;object-fit:contain;background:#000}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:14px;padding:7px 12px;
       background:linear-gradient(#000c,#0000);pointer-events:none;z-index:2}
  #hud b{color:#ff9ecb} #hud span{opacity:.7}
  #pad{display:none;position:absolute;inset:auto 0 0 0;justify-content:space-between;
       padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));z-index:3}
  #pad div{display:flex;gap:12px}
  #pad button{width:64px;height:64px;border-radius:50%;border:1px solid #ffffff2e;
              background:#ffffff1c;color:#fff;font-size:22px;-webkit-tap-highlight-color:transparent;touch-action:none}
  #pad button:active{background:#ff9ecb55}
  /* Touch layout only where the pointer is actually coarse. */
  @media (any-pointer:coarse){ body.touch #pad{display:flex} body.touch #hud{font-size:11px} }
</style>

<div id="stage"></div>
<div id="hud">
  <b id="role">connecting…</b><span id="peers"></span><span id="discord"></span>
  <span class="kb" id="keys"></span>
</div>
<div id="pad">
  <div><button data-dir="left">◀</button><button data-dir="right">▶</button></div>
  <div><button data-dir="down">▼</button><button data-dir="up">▲</button></div>
</div>

<script src="ruffle/ruffle.js"></script>
<script>
// One game, one screen. The host runs the only Ruffle instance and streams its canvas
// over WebRTC; every other peer watches that video and sends key events back, which the
// host injects into the same instance. So both players act on identical pixels.
//
// ponytail: video is one-way host->viewers and carries no audio (Ruffle mixes through
// WebAudio, not the canvas). Tap the AudioContext destination into the stream if sound
// matters. ponytail: STUN only — a symmetric-NAT pair needs a TURN server.

const RELAY_DIRECT = 'wss://gum-drop-hop.neodevils-contact.workers.dev/ws';
const SCOPES = ['identify', 'rpc.activities.write'];

// keyCode is what the SWF's Key.isDown() actually tests, so it has to be exact.
const KEYS = {
  KeyW:['w',87], KeyA:['a',65], KeyS:['s',83], KeyD:['d',68],
  ArrowUp:['ArrowUp',38], ArrowDown:['ArrowDown',40],
  ArrowLeft:['ArrowLeft',37], ArrowRight:['ArrowRight',39],
  ShiftLeft:['Shift',16], Space:[' ',32],
};

// Frame 96 runs two character clips with key sets hardcoded in the SWF: 87/83/65/68
// drives one, 37/38/39/40 drives the other. So each machine is allowed exactly one
// set and the mapping is identity — this is a gate, not a translation. Gating is the
// whole point: without it the host's arrows drive the second character locally.
const ROLE_KEYS = {
  host:  ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'Space'],
  guest: ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'],
};
const PAD_KEYS = {
  host:  {left:'KeyA', right:'KeyD', down:'KeyS', up:'KeyW'},
  guest: {left:'ArrowLeft', right:'ArrowRight', down:'ArrowDown', up:'ArrowUp'},
};

const ICE = {iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const q = new URLSearchParams(location.search);
const inDiscord = location.hostname.endsWith('.discordsays.com') ||
                  q.has('instance_id') || q.has('frame_id') || q.has('discord_proxy_ticket');

// Same origin everywhere the Worker serves the page too — on Cloudflare it is the
// Worker itself, in Discord it is the mapped /api prefix. Only the GitHub Pages
// mirror has no Worker behind it and needs the cross-origin address.
const RELAY = q.get('server') || (location.hostname.endsWith('github.io')
  ? RELAY_DIRECT
  : `${location.origin.replace(/^http/,'ws')}/api/ws`);

// Discord hands every participant of one activity the same instance_id -> same room.
const room = q.get('room') || q.get('instance_id') || location.hash.slice(1) || 'lobby';

const $ = s => document.querySelector(s);
const stage = $('#stage');
const ws = new WebSocket(`${RELAY}?room=${encodeURIComponent(room)}`);
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));

let host = null, player = null, pcs = new Map(), guestHeld = new Map();

ws.onmessage = async e => {
  const m = JSON.parse(e.data);
  if (m.t === 'role') { host = m.host; host ? startHost() : startViewer(); return; }
  if (host) await hostMsg(m); else await viewerMsg(m);
  $('#peers').textContent = pcs.size ? `${pcs.size + 1} playing` : 'waiting for P2';
  setActivity();
};
ws.onclose = () => $('#role').textContent = 'disconnected';
ws.onerror = () => $('#role').textContent = 'relay unreachable';

/* ---------- host: owns the game, streams it out ---------- */
let stream;
function startHost() {
  $('#role').textContent = 'PLAYER 1';
  $('#keys').innerHTML = 'your keys <b>WASD</b> · press <b>Shift</b> at the menu for 2-player';
  player = window.RufflePlayer.newest().createPlayer();
  stage.append(player);
  player.ruffle().load({url:'game.swf', autoplay:'on', unmuteOverlay:'hidden',
                        letterbox:'on', scale:'showAll', contextMenu:'off'});
}

async function canvasStream() {
  if (stream) return stream;
  let canvas;
  while (!(canvas = player.shadowRoot?.querySelector('canvas')))
    await new Promise(r => setTimeout(r, 200));
  return stream = canvas.captureStream(30);
}

async function hostMsg(m) {
  if (m.t === 'join') {
    const pc = new RTCPeerConnection(ICE);
    pcs.set(m.from, pc);
    (await canvasStream()).getTracks().forEach(t => pc.addTrack(t, stream));
    pc.onicecandidate = e => e.candidate && send({t:'ice', c:e.candidate, to:m.from});
    await pc.setLocalDescription(await pc.createOffer());
    send({t:'offer', d:pc.localDescription, to:m.from});
  } else if (m.t === 'answer') {
    await pcs.get(m.from)?.setRemoteDescription(m.d);
  } else if (m.t === 'ice') {
    await pcs.get(m.from)?.addIceCandidate(m.c).catch(()=>{});
  } else if (m.t === 'key') {
    if (!ROLE_KEYS.guest.includes(m.code)) return;   // a guest drives P2 only
    let h = guestHeld.get(m.from);
    if (!h) guestHeld.set(m.from, h = new Set());
    m.down ? h.add(m.code) : h.delete(m.code);
    inject(m.code, m.down);
  } else if (m.t === 'leave') {
    // Otherwise P2 keeps running in whatever direction they left holding.
    for (const code of guestHeld.get(m.from) || []) inject(code, false);
    guestHeld.delete(m.from);
    pcs.get(m.from)?.close(); pcs.delete(m.from);
  }
}

function inject(code, down) {
  const k = KEYS[code];
  if (!k) return;
  const [key, keyCode] = k;
  player?.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
    {key, code, keyCode, which: keyCode, bubbles: false, composed: true}));
}

/* ---------- viewer: watches the host's pixels, sends keys back ---------- */
let pc;
function startViewer() {
  $('#role').textContent = 'PLAYER 2';
  $('#keys').innerHTML = 'your keys <b>arrow keys</b>';
  const v = document.createElement('video');
  v.autoplay = v.playsInline = v.muted = true;
  stage.append(v);
  pc = new RTCPeerConnection(ICE);
  pc.ontrack = e => v.srcObject = e.streams[0];
  pc.onicecandidate = e => e.candidate && send({t:'ice', c:e.candidate});
  pcs.set(0, pc);
}

async function viewerMsg(m) {
  if (m.t === 'offer') {
    await pc.setRemoteDescription(m.d);
    await pc.setLocalDescription(await pc.createAnswer());
    send({t:'answer', d:pc.localDescription, to:m.from});
  } else if (m.t === 'ice') {
    await pc.addIceCandidate(m.c).catch(()=>{});
  }
}

/* ---------- input: host injects locally, viewers ship it upstream ---------- */
const held = new Set();

function press(code, down) {
  if (down === held.has(code)) return;      // Key.isDown is state-based; no repeats
  down ? held.add(code) : held.delete(code);
  host ? inject(code, down) : send({t:'key', code, down});
}

function route(e) {
  if (host === null || e.repeat) return;    // role not assigned yet
  const allowed = ROLE_KEYS[host ? 'host' : 'guest'];
  if (!allowed.includes(e.code)) return;
  e.preventDefault();
  press(e.code, e.type === 'keydown');
}
addEventListener('keydown', route, true);
addEventListener('keyup', route, true);

// A keyup lost to a tab switch or a dropped connection leaves the character running.
function releaseAll() { for (const code of [...held]) press(code, false); }
addEventListener('blur', releaseAll);
addEventListener('pagehide', releaseAll);
document.addEventListener('visibilitychange', () => document.hidden && releaseAll());

/* ---------- touch: phones and tablets get a pad instead of a keyboard ---------- */
const coarse = matchMedia('(any-pointer: coarse)').matches;
const touchable = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
if (coarse && touchable) {
  document.body.classList.add('touch');
  document.querySelectorAll('.kb').forEach(n => n.remove());
  for (const b of document.querySelectorAll('#pad button')) {
    const dir = b.dataset.dir;
    const code = () => PAD_KEYS[host ? 'host' : 'guest'][dir];
    const down = e => { e.preventDefault(); press(code(), true); };
    const up = e => { e.preventDefault(); press(code(), false); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
  }
}

/* ---------- Discord: handshake, then Rich Presence ---------- */
let sdk = null, authed = false;
async function initDiscord() {
  if (!inDiscord) return;
  const el = $('#discord');
  try {
    const { client_id } = await (await fetch('/api/config')).json();
    if (!client_id) { el.textContent = 'set DISCORD_CLIENT_ID'; return; }

    const { DiscordSDK } = await import('./discord-sdk.js');
    sdk = new DiscordSDK(client_id);
    await sdk.ready();
    el.textContent = 'discord ✓';
    const { code } = await sdk.commands.authorize({
      client_id, response_type: 'code', state: '', prompt: 'none', scope: SCOPES,
    });
    const r = await fetch('/api/auth/discord/token', {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({code}),
    });
    const { access_token } = await r.json();
    if (!access_token) throw new Error('no token');
    await sdk.commands.authenticate({ access_token });
    authed = true;
    setActivity();
  } catch (err) {
    el.textContent = '';
    console.warn('discord init failed', err);
  }
}

function setActivity() {
  if (!authed) return;
  const n = pcs.size + 1;
  sdk.commands.setActivity({ activity: {
    type: 0,
    details: n > 1 ? 'Playing together' : 'Waiting for Player 2',
    state: `${n}/2 players`,
    party: { id: room, size: [n, 2] },
    instance: true,
  }}).catch(() => {});
}
initDiscord();
</script>
