<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gum Drop Hop</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e8e8ea;overscroll-behavior:none;
            font:13px/1.4 system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  ruffle-player{width:100%;height:100%;background:#000}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:14px;padding:7px 12px;
       background:linear-gradient(#000c,#0000);pointer-events:none;z-index:2}
  #hud b{color:#ff9ecb} #hud span{opacity:.7}
  #pad{display:none;position:absolute;inset:auto 0 0 0;justify-content:space-between;
       padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));z-index:3}
  #pad div{display:flex;gap:12px}
  #pad button{width:64px;height:64px;border-radius:50%;border:1px solid #ffffff2e;
              background:#ffffff1c;color:#fff;font-size:22px;-webkit-tap-highlight-color:transparent;touch-action:none}
  #pad button:active{background:#ff9ecb55}
  /* Touch layout only where the pointer is actually coarse. */
  @media (any-pointer:coarse){ body.touch #pad{display:flex} body.touch #hud{font-size:11px} }
</style>

<div id="stage"></div>
<div id="hud">
  <b id="role">connecting…</b><span id="peers"></span><span id="discord"></span>
  <span class="kb" id="keys"></span><span id="last"></span>
</div>
<div id="pad">
  <div><button data-dir="left">◀</button><button data-dir="right">▶</button></div>
  <div><button data-dir="down">▼</button><button data-dir="up">▲</button></div>
</div>

<script src="ruffle/ruffle.js"></script>
<script>
// Both players run their own copy of the SWF and mirror keystrokes at each other,
// the way a shared keyboard would. Nobody streams video: each screen renders the
// game natively, at full quality, and both characters move on both screens because
// both instances receive both key sets.
//
// ponytail: no lockstep and no rollback — keys apply on arrival, so anything the
// game decides at random can drift the two copies apart. F5 together, or press R,
// which restarts both. Add frame-synced input queues only if drift is actually felt.

const RELAY_DIRECT = 'wss://gum-drop-hop.neodevils-contact.workers.dev/ws';
const SCOPES = ['identify', 'rpc.activities.write'];

// keyCode is what the SWF's Key.isDown() actually tests, so it has to be exact.
const KEYS = {
  KeyW:['w',87], KeyA:['a',65], KeyS:['s',83], KeyD:['d',68],
  ArrowUp:['ArrowUp',38], ArrowDown:['ArrowDown',40],
  ArrowLeft:['ArrowLeft',37], ArrowRight:['ArrowRight',39],
  ShiftLeft:['Shift',16], Space:[' ',32],
};

// Frame 96 runs two character clips with key sets hardcoded in the SWF: 87/83/65/68
// drives one, 37/38/39/40 drives the other. Each machine owns exactly one set and
// relays it; the other set only ever arrives over the wire. Without that split both
// characters would answer to whoever's keyboard is nearest.
const ROLE_KEYS = {
  host:  ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'Space'],
  guest: ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'],
};
// P2's keys are a local injection either way, so WASD can stand in for the arrows —
// Discord and Safari both have their own claims on the arrow keys.
const GUEST_ALIAS = {KeyW:'ArrowUp', KeyS:'ArrowDown', KeyA:'ArrowLeft', KeyD:'ArrowRight'};
const PAD_KEYS = {
  host:  {left:'KeyA', right:'KeyD', down:'KeyS', up:'KeyW'},
  guest: {left:'ArrowLeft', right:'ArrowRight', down:'ArrowDown', up:'ArrowUp'},
};

const q = new URLSearchParams(location.search);
const inDiscord = location.hostname.endsWith('.discordsays.com') ||
                  q.has('instance_id') || q.has('frame_id') || q.has('discord_proxy_ticket');

// Same origin everywhere the Worker serves the page too — on Cloudflare it is the
// Worker itself, in Discord it is the mapped /api prefix. Only the GitHub Pages
// mirror has no Worker behind it and needs the cross-origin address.
const RELAY = q.get('server') || (location.hostname.endsWith('github.io')
  ? RELAY_DIRECT
  : `${location.origin.replace(/^http/,'ws')}/api/ws`);

// Discord hands every participant of one activity the same instance_id -> same room.
const room = q.get('room') || q.get('instance_id') || location.hash.slice(1) || 'lobby';

const $ = s => document.querySelector(s);
const stage = $('#stage');
const ws = new WebSocket(`${RELAY}?room=${encodeURIComponent(room)}`);
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));

let host = null, player = null;
const peers = new Set();
const remoteHeld = new Map();   // peer id -> keys it is holding

ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'role') { host = m.host; startGame(); return; }

  // The relay only tells the room about an arrival, so the arrival learns who was
  // already there from the greeting back. An arrival also restarts the room, which
  // is the only way both copies can be on the same screen at the same time.
  if (m.t === 'join') { peers.add(m.from); send({t:'hello', to:m.from}); restartAll(); }
  else if (m.t === 'hello') peers.add(m.from);
  // A ready that lands after the room already started belongs to a peer still
  // sitting at the barrier — send it on its way rather than leaving it frozen.
  else if (m.t === 'ready') { ready.add(m.from); playing ? send({t:'go', to:m.from}) : maybeGo(); }
  else if (m.t === 'go') go();
  else if (m.t === 'leave') {
    // Otherwise their character keeps running in whatever direction they left it.
    for (const code of remoteHeld.get(m.from) || []) inject(code, false);
    remoteHeld.delete(m.from);
    peers.delete(m.from);
    ready.delete(m.from);
    maybeGo();                  // don't leave the survivor frozen at the barrier
  } else if (m.t === 'key') {
    // A peer may only drive the character its own role owns.
    if (!ROLE_KEYS[host ? 'guest' : 'host'].includes(m.code)) return;
    peers.add(m.from);
    let h = remoteHeld.get(m.from);
    if (!h) remoteHeld.set(m.from, h = new Set());
    m.down ? h.add(m.code) : h.delete(m.code);
    $('#last').textContent = `got ${m.code}`;
    inject(m.code, m.down);
  } else if (m.t === 'restart') {
    load();
  }

  hud();
  setActivity();
};

// The room id is on screen because "are we even in the same room" is otherwise
// unanswerable from either seat.
function hud() {
  $('#peers').textContent = `room ${room} · ` + (!peers.size
    ? 'waiting for the other player'
    : playing ? '2 playing' : 'syncing…');
}
ws.onclose = () => $('#role').textContent = 'disconnected';
ws.onerror = () => {
  $('#role').textContent = 'relay unreachable';
  // Inside Discord the only way to reach the Worker is a URL Mapping, so an
  // unreachable relay almost always means the portal points somewhere else.
  $('#keys').textContent = inDiscord
    ? `no mapping serves ${new URL(RELAY.replace(/^ws/,'http')).pathname} — point the Discord URL Mapping at the Worker`
    : `cannot reach ${RELAY}`;
};

/* ---------- the game, one identical copy per player ---------- */
// Both copies are held at the first frame until everyone has finished loading,
// then released together — otherwise whoever loaded first is already several
// seconds into the menu when the other arrives, and P1's Shift lands on two
// different screens. ponytail: this aligns the start, not every frame after it;
// a shared clock would be the next step if mid-game drift ever shows up.
const ready = new Set();
let playing = false, loadSeq = 0, loading = Promise.resolve();

// A guest loads on arrival and is told to restart in the same breath, so two loads
// land on one player unless they are queued — and the second tearing down the first
// mid-flight leaves a blank screen.
function load() {
  const seq = ++loadSeq;
  playing = false;
  ready.clear();
  hud();
  return loading = loading.then(() => seq === loadSeq && doLoad(seq));
}

async function doLoad(seq) {
  await player.ruffle().load({url:'game.swf', autoplay:'on', unmuteOverlay:'hidden',
                              letterbox:'on', scale:'showAll', contextMenu:'off'});
  if (seq !== loadSeq) return;   // a newer restart overtook this one
  player.pause();
  // Ruffle puts its own play button up on pause; nobody here is meant to click it.
  player.shadowRoot?.querySelector('#play-button')?.style.setProperty('display', 'none');
  if (host) { ready.add('me'); maybeGo(); } else send({t:'ready'});
}

// Host is the referee: it starts everyone once every copy reports in, and starts
// alone if it is the only one here.
function maybeGo() {
  if (!host || !ready.has('me')) return;
  if ([...peers].some(p => !ready.has(p))) return;
  send({t:'go'});
  go();
}

function go() {
  playing = true;
  player.play();
  player.focus();
  hud();
}

function restartAll() {
  send({t:'restart'});
  load();
}

function startGame() {
  $('#role').textContent = host ? 'PLAYER 1' : 'PLAYER 2';
  $('#keys').innerHTML = host
    ? 'your keys <b>WASD</b> · press <b>Shift</b> at the menu for 2-player'
    : 'your keys <b>arrows</b> or <b>WASD</b>';
  player = window.RufflePlayer.newest().createPlayer();
  stage.append(player);
  load();
  // Ruffle only acts on keys once it has focus, and in an iframe the document has
  // to be focused first — a click on the page is not enough inside Discord.
  addEventListener('pointerdown', () => { window.focus(); player.focus(); });
  window.focus();
  player.focus();
}

// Ruffle registers its key handlers on `window` (bubble phase), so an event
// dispatched at the player element never reaches it. Fire at window instead.
function inject(code, down) {
  const k = KEYS[code];
  if (!k) return;
  const [key, keyCode] = k;
  dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
    {key, code, keyCode, which: keyCode, bubbles: true, composed: true}));
}

/* ---------- input: play it here, and send it there ---------- */
const held = new Set();

function press(code, down) {
  if (down === held.has(code)) return;      // Key.isDown is state-based; no repeats
  down ? held.add(code) : held.delete(code);
  $('#last').textContent = `sent ${code}`;
  inject(code, down);
  send({t:'key', code, down});
}

function route(e) {
  if (!e.isTrusted) return;                 // our own inject(); let it reach Ruffle
  if (host === null || e.repeat) return;    // role not assigned yet

  // Restarting one copy alone just guarantees the two disagree.
  if (e.code === 'KeyR' && e.type === 'keydown') return restartAll();

  const code = host ? e.code : (GUEST_ALIAS[e.code] || e.code);
  if (!ROLE_KEYS[host ? 'host' : 'guest'].includes(code)) {
    // preventDefault alone does not stop Ruffle's own window listener, so P1's
    // arrows would still drive P2's character locally. Kill the event outright.
    if (KEYS[e.code]) { e.preventDefault(); e.stopImmediatePropagation(); }
    return;
  }
  e.preventDefault();
  press(code, e.type === 'keydown');
}
addEventListener('keydown', route, true);
addEventListener('keyup', route, true);

// A keyup lost to a tab switch or a dropped connection leaves the character running.
function releaseAll() { for (const code of [...held]) press(code, false); }
addEventListener('blur', releaseAll);
addEventListener('pagehide', releaseAll);
document.addEventListener('visibilitychange', () => document.hidden && releaseAll());

/* ---------- touch: phones and tablets get a pad instead of a keyboard ---------- */
const coarse = matchMedia('(any-pointer: coarse)').matches;
const touchable = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
if (coarse && touchable) {
  document.body.classList.add('touch');
  document.querySelectorAll('.kb').forEach(n => n.remove());
  for (const b of document.querySelectorAll('#pad button')) {
    const dir = b.dataset.dir;
    const code = () => PAD_KEYS[host ? 'host' : 'guest'][dir];
    const down = e => { e.preventDefault(); press(code(), true); };
    const up = e => { e.preventDefault(); press(code(), false); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
  }
}

/* ---------- Discord: handshake, then Rich Presence ---------- */
let sdk = null, authed = false;
async function initDiscord() {
  if (!inDiscord) return;
  const el = $('#discord');
  try {
    const { client_id } = await (await fetch('/api/config')).json();
    if (!client_id) { el.textContent = 'set DISCORD_CLIENT_ID'; return; }

    const { DiscordSDK } = await import('./discord-sdk.js');
    sdk = new DiscordSDK(client_id);
    await sdk.ready();
    el.textContent = 'discord ✓';

    // Authorizing buys nothing but a custom presence line — Discord already shows
    // the activity without it — and every launch that fails re-prompts the user.
    // Opt in with ?rpc=1 once the app really has the rpc.activities.write scope.
    if (!q.has('rpc')) return;

    const { code } = await sdk.commands.authorize({
      client_id, response_type: 'code', state: '', prompt: 'none', scope: SCOPES,
    });
    const r = await fetch('/api/auth/discord/token', {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({code}),
    });
    const { access_token, error, error_description } = await r.json();
    if (!access_token) throw new Error(error_description || error || 'no token');
    await sdk.commands.authenticate({ access_token });
    authed = true;
    setActivity();
  } catch (err) {
    // Swallowing this is why "no status" looked like nothing happening at all.
    el.textContent = `discord: ${err.message || err}`;
    console.warn('discord init failed', err);
  }
}

function setActivity() {
  if (!authed) return;
  const n = peers.size + 1;
  sdk.commands.setActivity({ activity: {
    type: 0,
    details: n > 1 ? 'Playing together' : 'Waiting for Player 2',
    state: `${n}/2 players`,
    party: { id: room, size: [n, 2] },
    instance: true,
  }}).catch(() => {});
}
initDiscord();
</script>
